name: Duet - acordar

# A cada 10 minutos: se o Codespace estiver desligado e houver mensagem
# esperando no Telegram, liga o Codespace. Repositório público = minutos grátis.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: duet-acordar
  cancel-in-progress: false

jobs:
  acordar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python duet/duet.py acordar
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DUET_REPO: ${{ github.repository }}
