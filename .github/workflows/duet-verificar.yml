name: Duet - verificar

# De hora em hora, das 7h às 23h (Brasília): olha e-mail, Drive, GitHub e Vercel
# e só manda aviso no Telegram se houver algo importante. Não liga o Codespace.
on:
  schedule:
    - cron: "7 0-2,10-23 * * *"   # horário UTC = 7h a 23h em Brasília
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEM_CC: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: duet/requirements.txt
      - run: pip install -r duet/requirements.txt
      - name: Instalar Claude Code (só se houver token da assinatura)
        if: env.TEM_CC == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - run: python duet/duet.py verificar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DUET_PROVEDOR: ${{ secrets.DUET_PROVEDOR }}
          DUET_PROVEDOR_VERIFICACAO: ${{ secrets.DUET_PROVEDOR_VERIFICACAO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DUET_ESTADO: /tmp/duet
